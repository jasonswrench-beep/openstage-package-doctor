<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenStage Package Doctor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to the report</a>
  <header class="shell" role="banner">
    <img class="shell-logo" src="logo.svg" alt="" width="32" height="32">
    <span class="shell-name">Package Doctor</span>
    <span class="shell-doc" id="shell-doc"></span>
    <span class="shell-spacer"></span>
    <button type="button" class="shell-button" id="open-button" aria-keyshortcuts="Control+O"></button>
    <button type="button" class="shell-button" id="copy-button" disabled></button>
  </header>
  <main id="main" tabindex="-1"></main>
  <div class="drop-veil" id="drop-veil" hidden><p>Drop the package to open it</p></div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <input type="file" id="file-input" accept=".zip,application/zip,application/x-zip-compressed" hidden>
  <script src="main.js"></script>
</body>
</html>
