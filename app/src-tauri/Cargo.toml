[package]
name = "openstage-package-doctor"
version = "0.6.0"
description = "OpenStage Package Doctor: opens a course package without its source file and checks whether it will run"
authors = ["Jason S. Wrench"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/jasonswrench-beep/openstage-pd"

[lib]
name = "openstage_package_doctor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The suite's accessibility engine (A11Y-1), from openstage-core at its released tag. Apache-2.0.
openstage-a11y = { git = "https://github.com/jasonswrench-beep/openstage-core", tag = "a11y-v0.1.0" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
